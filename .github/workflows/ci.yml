name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q tests

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build training image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.train
          tags: mlops-train:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serve
          tags: mlops-serve:ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests with kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/
