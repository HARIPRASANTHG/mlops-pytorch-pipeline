# Template only. Real secrets are created out-of-band and never committed:
#   kubectl create secret generic ml-registry-creds -n ml-training \
#     --from-literal=DOCKERHUB_USERNAME=... --from-literal=DOCKERHUB_TOKEN=...
# (k8s/*-secret.yaml is listed in .gitignore.)
apiVersion: v1
kind: Secret
metadata:
  name: ml-registry-creds
  namespace: ml-training
type: Opaque
stringData:
  DOCKERHUB_USERNAME: REPLACE_ME
  DOCKERHUB_TOKEN: REPLACE_ME
