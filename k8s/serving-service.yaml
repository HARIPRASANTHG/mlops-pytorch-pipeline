apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: model-serving
spec:
  type: ClusterIP        # swap to LoadBalancer on a cloud cluster
  selector:
    app: model-serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
