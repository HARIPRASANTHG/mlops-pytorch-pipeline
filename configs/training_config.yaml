# Local / Docker training config.
# The Kubernetes Job gets the same schema from k8s/configmap.yaml.
model:
  architecture: resnet18      # resnet18 | simple_cnn
  num_classes: 10
  pretrained: false

training:
  epochs: 20
  batch_size: 128             # 128 fits comfortably in 12 GB on the RTX 5070 Ti
  learning_rate: 0.001
  weight_decay: 0.0005
  label_smoothing: 0.1
  early_stopping_patience: 3
  num_workers: 4              # set to 0 on Windows if DataLoader workers hang
  seed: 42
  device: auto                # auto | cuda | cpu
  mixed_precision: true       # AMP (fp16) - big speedup on Blackwell

data:
  dataset: cifar10
  data_dir: ./data

output:
  checkpoint_dir: ./checkpoints
  model_name: classifier_v1.pt
